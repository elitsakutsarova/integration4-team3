    font-size: clamp(1.7rem, 7.5vw, 2.5rem);
    line-height: 1.15;
    color: var(--text-dark);
    background: var(--yellow);
    display: inline;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    padding: 4px 10px;
  }

  /* ── scrapbook collage zone ── */
  .scrapbook {
    position: relative;
    z-index: 10;
    flex: 1;
    min-height: clamp(420px, 100vw, 520px);
    margin-top: clamp(14px, 3vw, 22px);
  }

  .scrap-item {
    position: absolute;
  }

  /* memo1: Antwerp station photo, top-left, rotated left */
  .memo-1 {
    top: 6%;
    left: 4%;
    width: clamp(140px, 38vw, 190px);
    transform: rotate(-7deg);
    filter: drop-shadow(3px 4px 10px rgba(0,0,0,0.2));
    z-index: 3;
  }
  .memo-1 img { width: 100%; display: block; }

  /* sticky note: "I had the best time here!" */
  .sticky-note {
    top: 13%;
    right: 4%;
    width: clamp(115px, 32vw, 160px);
    background: var(--yellow);
    padding: 12px 14px 14px;
    transform: rotate(-2deg);
    box-shadow: 3px 4px 10px rgba(0,0,0,0.15);
    z-index: 4;
  }
  .sticky-note p {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(0.78rem, 3vw, 0.92rem);
    line-height: 1.3;
    color: var(--text-dark);
    margin-bottom: 8px;
  }
  .sticky-note .place-link {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.68rem, 2.6vw, 0.8rem);
    color: var(--navy);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .sticky-note .pin-icon {
    width: 12px;
    height: auto;
    flex-shrink: 0;
  }

  /* memo2: live music photo, mid-right */
  .memo-2 {
    top: 35%;
    right: 1%;
    width: clamp(150px, 40vw, 200px);
    transform: rotate(5deg);
    filter: drop-shadow(3px 4px 10px rgba(0,0,0,0.2));
    z-index: 3;
  }
  .memo-2 img { width: 100%; display: block; }

  /* "Now!" green badge */
  .now-badge {
    top: 56%;
    left: 3%;
    width: clamp(50px, 14vw, 68px);
    z-index: 5;
  }
  .now-badge svg { width: 100%; height: auto; display: block; }
  .now-badge text {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
  }

  /* memo3: Weekends Getaway card, lower-left */
  .memo-3 {
    top: 58%;
    left: 1%;
    width: clamp(155px, 42vw, 205px);
    transform: rotate(-3deg);
    filter: drop-shadow(3px 4px 10px rgba(0,0,0,0.2));
    z-index: 3;
  }
  .memo-3 img { width: 100%; display: block; }

  /* "the best at 4AM" yellow tag, peeking behind memo3 */
  .peek-tag {
    top: 60%;
    left: 32%;
    width: clamp(90px, 24vw, 120px);
    background: var(--yellow);
    padding: 10px 8px;
    transform: rotate(8deg);
    z-index: 2;
    box-shadow: 2px 3px 8px rgba(0,0,0,0.12);
  }
  .peek-tag p {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: clamp(0.7rem, 2.6vw, 0.82rem);
    line-height: 1.25;
    color: var(--text-dark);
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
  }

  /* ── bottom headline ── */
  .headline-bottom {
    position: relative;
    z-index: 10;
    padding: 0 clamp(16px, 5vw, 28px);
    margin-top: clamp(8px, 2vw, 14px);
  }

  /* ── description bubble ── */
  .description {
    position: relative;
    z-index: 10;
    margin: clamp(12px, 3vw, 20px) clamp(16px, 5vw, 28px) 0;
  }
  .bubble {
    background: var(--periwinkle);
    border-radius: 12px;
    padding: clamp(12px, 3vw, 18px) clamp(14px, 4vw, 20px);
  }
  .bubble p {
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(0.78rem, 3.2vw, 0.95rem);
    line-height: 1.5;
    color: var(--white);
  }

  /* ── nav row ── */
  .nav-row {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: clamp(16px, 4vw, 24px) clamp(16px, 5vw, 28px) clamp(20px, 5vw, 32px);
  }

  .btn-back {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(0.85rem, 3.5vw, 1rem);
    color: var(--navy);
    background: none;
    border: 2px dashed var(--navy);
    padding: 9px 22px;
    border-radius: 6px;
    cursor: pointer;
  }

  .dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--periwinkle);
    opacity: 0.35;
  }
  .dot.active {
    opacity: 1;
    transform: scale(1.15);
  }

  .btn-next {
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: clamp(0.85rem, 3.5vw, 1rem);
    color: var(--white);
    background: var(--navy);
    border: none;
    padding: 10px 28px;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background 0.15s;
  }
  .btn-next:hover { background: #2e2e7a; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
