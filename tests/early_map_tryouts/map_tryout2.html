<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemoMe — Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet" />

  <style>
    /* ─── Tokens ─────────────────────────────────── */
    :root {
      --bg:      #F5F2EC;
      --blue:    #3535FF;
      --mint:    #00E87A;
      --yellow:  #FFE03A;
      --pink:    #F9C0D9;
      --dark:    #18181F;
      --mid:     #9090A0;
      --font:    'Space Grotesk', sans-serif;
      --script:  'Playfair Display', serif;
      --dash:    2px dashed var(--dark);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { background: var(--bg); font-family: var(--font); overflow: hidden; }

    /* ─── Subtle pixel-grid overlay ─────────────── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9000;
      background-image:
        linear-gradient(rgba(24,24,31,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24,24,31,.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* ─── Map container ──────────────────────────── */
    #map { width: 100vw; height: 100vh; }

    /* Desaturate + warm-tint the tile layer */
    .leaflet-layer { filter: saturate(0.25) brightness(1.06) sepia(0.12); }

    /* ─── Zoom controls ──────────────────────────── */
    .leaflet-control-zoom {
      border: var(--dash) !important;
      border-radius: 0 !important;
      overflow: hidden;
    }
    .leaflet-control-zoom a {
      width: 34px !important; height: 34px !important;
      line-height: 34px !important;
      background: var(--bg) !important;
      color: var(--dark) !important;
      font-family: var(--font) !important;
      font-weight: 700 !important;
      font-size: 18px !important;
      border: none !important;
      border-bottom: 1px dashed var(--dark) !important;
      transition: background .15s;
    }
    .leaflet-control-zoom a:last-child { border-bottom: none !important; }
    .leaflet-control-zoom a:hover { background: var(--yellow) !important; }

    /* ─── Scale bar ──────────────────────────────── */
    .leaflet-control-scale-line {
      background: var(--bg) !important;
      border: 2px solid var(--dark) !important;
      border-top: none !important;
      font-family: var(--font) !important;
      font-size: 10px !important;
      color: var(--dark) !important;
      padding: 2px 6px !important;
    }

    /* ─── Attribution ────────────────────────────── */
    .leaflet-control-attribution {
      background: transparent !important;
      font-family: var(--font) !important;
      font-size: 10px !important;
      color: var(--mid) !important;
    }
    .leaflet-control-attribution a { color: var(--mid) !important; }

    /* ─── Popup ──────────────────────────────────── */
    .leaflet-popup-content-wrapper {
      background: var(--bg) !important;
      border: var(--dash) !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      padding: 0 !important;
    }
    .leaflet-popup-tip-container { display: none; }
    .leaflet-popup-close-button {
      color: var(--dark) !important;
      font-size: 18px !important;
      top: 6px !important; right: 8px !important;
    }
    .leaflet-popup-content { margin: 14px 16px 12px !important; }

    .p-label {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 2px 7px;
      margin-bottom: 6px;
    }
    .p-title {
      font-family: var(--script);
      font-style: italic;
      font-size: 18px;
      color: var(--dark);
      line-height: 1.25;
    }
    .p-desc {
      font-size: 11px;
      color: var(--mid);
      margin-top: 5px;
      line-height: 1.5;
    }

    /* ─── Branding pill (top-left) ───────────────── */
    .brand {
      display: flex;
      align-items: baseline;
      gap: 6px;
      background: var(--bg);
      border: var(--dash);
      padding: 9px 16px 9px 14px;
      pointer-events: none;
      user-select: none;
    }
    .brand-name {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -.4px;
      text-transform: uppercase;
      color: var(--dark);
    }
    .brand-script {
      font-family: var(--script);
      font-style: italic;
      font-size: 17px;
      color: var(--blue);
    }

    /* ─── Legend chip (bottom-right, above zoom) ─── */
    .legend {
      background: var(--bg);
      border: var(--dash);
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 8px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--dark);
    }
    .legend-dot {
      width: 14px; height: 14px;
      flex-shrink: 0;
      border: 2px dashed var(--dark);
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const C = {
    bg:     '#F5F2EC',
    blue:   '#3535FF',
    mint:   '#00E87A',
    yellow: '#FFE03A',
    pink:   '#F9C0D9',
    dark:   '#18181F',
    mid:    '#9090A0',
  };

  /* ─── Map init ──────────────────────────────────── */
  const map = L.map('map', {
    center: [48.858, 2.347],
    zoom: 14,
    zoomControl: false,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20,
  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.control.scale({ imperial: false, position: 'bottomleft' }).addTo(map);

  /* ─── Sticker marker factory ────────────────────── */
  function stickerIcon(bg, glyph, rotation = -4) {
    return L.divIcon({
      className: '',
      html: `
        <div style="
          position: relative;
          width: 40px; height: 40px;
          background: ${bg};
          border: 2.5px dashed ${C.dark};
          display: flex; align-items: center; justify-content: center;
          font-family: 'Space Grotesk', sans-serif;
          font-weight: 700; font-size: 16px;
          color: ${C.dark};
          transform: rotate(${rotation}deg);
          cursor: pointer;
          transition: transform .15s;
        ">${glyph}</div>
        <div style="
          position: absolute;
          bottom: -8px; left: 50%;
          transform: translateX(-50%);
          width: 2px; height: 8px;
          background: ${C.dark};
        "></div>
      `,
      iconSize: [40, 48],
      iconAnchor: [20, 48],
      popupAnchor: [0, -52],
    });
  }

  /* ─── Pins ──────────────────────────────────────── */
  const pins = [
    {
      ll: [48.858, 2.347],
      bg: C.blue,  glyph: '★', rot: -3,
      label: 'HOME', labelBg: C.blue,
      title: 'Place de départ',
      desc:  'Your base. Everything starts here.',
    },
    {
      ll: [48.8606, 2.3376],
      bg: C.mint,  glyph: '↑', rot: 4,
      label: 'SPOT', labelBg: C.mint,
      title: 'Jardin des Tuileries',
      desc:  'Golden hour content is calling.',
    },
    {
      ll: [48.8534, 2.3488],
      bg: C.yellow, glyph: '♥', rot: -5,
      label: 'FAV', labelBg: C.yellow,
      title: 'Café Voltaire',
      desc:  'Best oat latte in the 6th. No debate.',
    },
    {
      ll: [48.8628, 2.362],
      bg: C.pink, glyph: '✦', rot: 3,
      label: 'NEW', labelBg: C.pink,
      title: 'Marais Gallery',
      desc:  'Opening this weekend — go early.',
    },
    {
      ll: [48.8544, 2.3413],
      bg: C.bg, glyph: '+', rot: -2,
      label: 'ADD', labelBg: '#dedad2',
      title: 'Add a spot',
      desc:  'Tap to pin a new memory here.',
    },
  ];

  pins.forEach(p => {
    L.marker(p.ll, { icon: stickerIcon(p.bg, p.glyph, p.rot) })
      .addTo(map)
      .bindPopup(`
        <span class="p-label" style="background:${p.labelBg}">${p.label}</span>
        <div class="p-title">${p.title}</div>
        <div class="p-desc">${p.desc}</div>
      `);
  });

  /* ─── Branding control (top-left) ───────────────── */
  L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const el = L.DomUtil.create('div', 'brand');
      el.innerHTML = `
        <span class="brand-name">MemoMe</span>
        <span class="brand-script">map</span>
      `;
      L.DomEvent.disableClickPropagation(el);
      return el;
    },
  }).extend({})  ;

  const BrandControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const el = L.DomUtil.create('div', 'brand');
      el.innerHTML = `<span class="brand-name">MemoMe</span><span class="brand-script">map</span>`;
      L.DomEvent.disableClickPropagation(el);
      return el;
    },
  });
  new BrandControl().addTo(map);

  /* ─── Legend control (bottom-right, above zoom) ─── */
  const LegendControl = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd() {
      const el = L.DomUtil.create('div', 'legend');
      el.style.marginBottom = '50px';
      const items = [
        { bg: C.blue,   label: 'Home base' },
        { bg: C.mint,   label: 'Content spot' },
        { bg: C.yellow, label: 'Favourite' },
        { bg: C.pink,   label: 'New drop' },
      ];
      el.innerHTML = items.map(i => `
        <div class="legend-row">
          <div class="legend-dot" style="background:${i.bg}"></div>
          <span>${i.label}</span>
        </div>
      `).join('');
      L.DomEvent.disableClickPropagation(el);
      return el;
    },
  });
  new LegendControl().addTo(map);
</script>
</body>
</html>
